name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (no model download)
        # Install only the package + dev deps, not the en_core_web_lg wheel,
        # so the unit tests run fast without a 400 MB download.
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests (no model required)
        run: pytest tests/ -v -m "not integration"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + model
        # Same path users take: the [model] extra pins the en_core_web_lg wheel.
        run: pip install -e ".[dev,model]"
      - name: Integration tests
        run: pytest tests/ -v -m integration
